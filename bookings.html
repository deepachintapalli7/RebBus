<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute - My Bookings</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg,#071952,#088395);
            padding: 25px 15px;
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 7px 0;
            border-radius: 12px;
        }

        .menu a:hover,
        .menu .active {
            background: rgba(255,255,255,.2);
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 250px;
            padding: 35px;
        }

        h1 {
            color: #071952;
            margin-bottom: 25px;
        }

        /* ================= BOOKING CARD ================= */

        .booking-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 7px 20px rgba(0,0,0,.07);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .booking-header h2 {
            color: #071952;
        }

        .status {
            background: #d9f8e8;
            color: #087443;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 18px;
        }

        .detail {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
        }

        .detail span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail strong {
            color: #071952;
        }

        /* ================= EMPTY ================= */

        .empty {
            background: white;
            padding: 60px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 7px 20px rgba(0,0,0,.07);
        }

        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty h2 {
            color: #071952;
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;
        }

        .book-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #088395;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        /* ================= CLEAR BUTTON ================= */

        .clear-btn {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #d00000;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:800px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        🚌 BookMyRoute
    </div>

    <div class="menu">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="booking.html">
            🎫 Book a Bus
        </a>

        <a href="bookings.html" class="active">
            📋 My Bookings
        </a>

        <a href="account.html">
            👤 My Account
        </a>

        <a href="support.html">
            📞 24/7 Support
        </a>

        <a href="about.html">
            ℹ️ About Us
        </a>

        <a href="login.html">
            🚪 Logout
        </a>

    </div>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <h1>
        📋 My Bookings
    </h1>

    <div id="bookingList"></div>

</div>


<script>

/* =====================================================
   LOAD BOOKINGS
   ===================================================== */

function loadBookings() {

    const bookingList =
        document.getElementById("bookingList");


    const bookings =
        JSON.parse(
            localStorage.getItem("bookMyRouteBookings")
        ) || [];


    /* No bookings */

    if (bookings.length === 0) {

        bookingList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🎫
                </div>

                <h2>
                    No bookings yet
                </h2>

                <p>
                    Your confirmed bus bookings will appear here.
                </p>

                <a
                    href="booking.html"
                    class="book-btn"
                >
                    Book Your First Bus 🚌
                </a>

            </div>

        `;

        return;
    }


    /* Clear old content */

    bookingList.innerHTML = "";


    /* Show bookings */

    bookings.forEach(function(booking, index) {

        const card =
            document.createElement("div");

        card.className =
            "booking-card";


        card.innerHTML = `

            <div class="booking-header">

                <h2>
                    🚌 ${booking.busName}
                </h2>

                <span class="status">
                    ✅ Confirmed
                </span>

            </div>


            <div class="details">

                <div class="detail">

                    <span>
                        Passenger
                    </span>

                    <strong>
                        ${booking.name}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Route
                    </span>

                    <strong>
                        ${booking.from}
                        →
                        ${booking.to}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Journey Date
                    </span>

                    <strong>
                        ${booking.journeyDate}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Bus Number
                    </span>

                    <strong>
                        ${booking.busNumber}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Bus Type
                    </span>

                    <strong>
                        ${booking.busType}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Seat
                    </span>

                    <strong>
                        💺 ${booking.seat}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Departure
                    </span>

                    <strong>
                        🕐 ${booking.departure}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Arrival
                    </span>

                    <strong>
                        🕐 ${booking.arrival}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Price
                    </span>

                    <strong>
                        ₹${booking.price}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Phone
                    </span>

                    <strong>
                        ${booking.phone}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Email
                    </span>

                    <strong>
                        ${booking.email}
                    </strong>

                </div>

            </div>

        `;


        bookingList.appendChild(card);

    });


    /* Clear bookings button */

    const clearButton =
        document.createElement("button");

    clearButton.className =
        "clear-btn";

    clearButton.innerText =
        "Clear Booking History";

    clearButton.onclick =
        clearBookings;


    bookingList.appendChild(clearButton);

}


/* =====================================================
   CLEAR BOOKINGS
   ===================================================== */

function clearBookings() {

    localStorage.removeItem(
        "bookMyRouteBookings"
    );

    loadBookings();

}


/* =====================================================
   LOAD WHEN PAGE OPENS
   ===================================================== */

loadBookings();

</script>

</body>
</html>
