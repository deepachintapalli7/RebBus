<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071952, #088395, #35A29F);
        }

        .register-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #071952;
            margin-top: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        label {
            display: block;
            margin: 13px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #088395;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#071952,#088395);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .login a {
            color: #088395;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">🚌</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join BookMyRoute today ✨
    </p>

    <form onsubmit="registerUser(event)">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Create username"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >

        <label>Phone</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Create Account 🚀
        </button>

    </form>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>

function registerUser(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    if (password !== confirmPassword) {

        message.innerText =
            "❌ Passwords do not match.";

        message.style.color = "red";

        return;
    }

    /*
       Temporary UI navigation.
       Real database registration will be connected next.
    */

    message.innerText =
        "✅ Account created! Redirecting to login...";

    message.style.color = "green";

    setTimeout(function() {

        window.location.href = "login.html";

    }, 1200);
}

</script>

</body>
</html>
