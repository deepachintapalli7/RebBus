<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #071952, #088395, #35A29F);
        }

        /* Moving road */
        .road {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #171717;
        }

        .road::after {
            content: "";
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 80px,
                transparent 80px,
                transparent 150px
            );
            animation: roadMove 1s linear infinite;
        }

        @keyframes roadMove {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-150px);
            }
        }

        /* Bus */
        .bus {
            position: fixed;
            bottom: 55px;
            left: -250px;
            font-size: 90px;
            animation: busMove 9s linear infinite;
            z-index: 1;
        }

        @keyframes busMove {
            0% {
                left: -250px;
            }
            100% {
                left: 110%;
            }
        }

        .login-box {
            position: relative;
            z-index: 5;
            width: 390px;
            padding: 40px;
            background: rgba(255,255,255,0.97);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #071952;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #222;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #088395;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #071952, #088395);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #088395;
            font-weight: bold;
            text-decoration: none;
        }

        .tagline {
            text-align: center;
            margin-top: 15px;
            color: #088395;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="bus">🚌</div>
    <div class="road"></div>

    <div class="login-box">

        <div class="logo">🚌</div>

        <h1>BookMyRoute</h1>

        <p class="subtitle">
            Your journey starts here ✨
        </p>

        <form onsubmit="loginUser(event)">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login 🚀
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>

        <div class="tagline">
            Safe • Simple • Smart Travel
        </div>

    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username && password) {
                window.location.href = "dashboard.html";
            }
        }
    </script>

</body>
</html>
