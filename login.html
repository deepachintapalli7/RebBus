<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #071952, #088395, #35A29F);
        }

        .road {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: #202020;
        }

        .road::after {
            content: "";
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 7px;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 80px,
                transparent 80px,
                transparent 150px
            );
            animation: roadMove 1s linear infinite;
        }

        @keyframes roadMove {
            from {
                background-position: 0;
            }
            to {
                background-position: -150px;
            }
        }

        .bus {
            position: fixed;
            bottom: 50px;
            left: -180px;
            font-size: 80px;
            z-index: 2;
            animation: busMove 8s linear infinite;
        }

        @keyframes busMove {
            from {
                left: -180px;
            }
            to {
                left: 110%;
            }
        }

        .login-box {
            position: relative;
            z-index: 5;
            width: 390px;
            background: white;
            padding: 38px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #071952;
            margin-top: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #088395;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#071952,#088395);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        .otp-section {
            display: none;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .register a {
            color: #088395;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #088395;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="bus">🚌</div>
<div class="road"></div>

<div class="login-box">

    <div class="logo">🚌</div>

    <h1>BookMyRoute</h1>

    <p class="subtitle">
        Secure login with Gmail OTP
    </p>


    <!-- GMAIL -->

    <div id="emailSection">

        <label>Gmail Address</label>

        <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            required
        >

        <button onclick="sendOTP()">
            Send OTP 📩
        </button>

    </div>


    <!-- OTP -->

    <div class="otp-section" id="otpSection">

        <label>Enter OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >

        <button onclick="verifyOTP()">
            Verify OTP 🔐
        </button>

        <div class="back" id="backButton"
             onclick="goBack()">
            ← Change Gmail
        </div>

    </div>


    <p class="message" id="message"></p>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

function sendOTP() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");

    if (!email) {

        message.innerText =
            "❌ Please enter your Gmail address.";

        message.style.color = "red";

        return;
    }

    if (!email.toLowerCase().endsWith("@gmail.com")) {

        message.innerText =
            "❌ Please enter a valid Gmail address.";

        message.style.color = "red";

        return;
    }


    /*
       REAL OTP BACKEND WILL BE CONNECTED HERE.

       The Java server will:
       1. Receive Gmail
       2. Generate a secure OTP
       3. Send OTP through email
       4. Store OTP temporarily
    */

    fetch("/send-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email
        })

    })

    .then(response => response.text())

.then(data => {

    console.log("Server response:", data);

    if (data === "OTP_SENT") {

        message.innerText =
            "📩 OTP sent to your Gmail.";

        message.style.color = "green";

        document.getElementById("emailSection")
            .style.display = "none";

        document.getElementById("otpSection")
            .style.display = "block";

        document.getElementById("backButton")
            .style.display = "block";

    } else if (data === "EMAIL_FAILED") {

        message.innerText =
            "❌ Email could not be sent. Check Gmail settings.";

        message.style.color = "red";

    } else if (data === "INVALID_EMAIL") {

        message.innerText =
            "❌ Please use a Gmail address.";

        message.style.color = "red";

    } else {

        message.innerText =
            "❌ Server error: " + data;

        message.style.color = "red";
    }

})
    .catch(error => {

        console.error(error);

        message.innerText =
            "❌ Unable to send OTP. Please try again.";

        message.style.color = "red";

    });
}


function verifyOTP() {

    const email =
        document.getElementById("email").value;

    const otp =
        document.getElementById("otp").value.trim();

    const message =
        document.getElementById("message");


    if (otp.length !== 6) {

        message.innerText =
            "❌ Enter the 6-digit OTP.";

        message.style.color = "red";

        return;
    }


    fetch("/verify-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email,
            otp: otp
        })

    })

    .then(response => response.text())

    .then(data => {

        if (data === "SUCCESS") {

            window.location.href =
                "dashboard.html";

        } else {

            message.innerText =
                "❌ Invalid or expired OTP.";

            message.style.color = "red";

        }

    })

    .catch(error => {

        console.error(error);

        message.innerText =
            "❌ Verification failed.";

        message.style.color = "red";

    });
}


function goBack() {

    document.getElementById("emailSection")
        .style.display = "block";

    document.getElementById("otpSection")
        .style.display = "none";

    document.getElementById("message")
        .innerText = "";

    document.getElementById("otp")
        .value = "";
}

</script>

</body>
</html>
