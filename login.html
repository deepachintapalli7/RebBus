<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute - Login</title>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #071952, #088395, #35A29F);
        }

        .road {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: #202020;
        }

        .road::after {
            content: "";
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 7px;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 80px,
                transparent 80px,
                transparent 150px
            );
            animation: roadMove 1s linear infinite;
        }

        @keyframes roadMove {
            from {
                background-position: 0;
            }
            to {
                background-position: -150px;
            }
        }

        .bus {
            position: fixed;
            bottom: 50px;
            left: -180px;
            font-size: 80px;
            z-index: 2;
            animation: busMove 8s linear infinite;
        }

        @keyframes busMove {
            from {
                left: -180px;
            }
            to {
                left: 110%;
            }
        }

        .login-box {
            position: relative;
            z-index: 5;
            width: 390px;
            background: white;
            padding: 38px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #071952;
            margin-top: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #088395;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#071952,#088395);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-section {
            display: none;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .register a {
            color: #088395;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #088395;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="bus">🚌</div>
<div class="road"></div>

<div class="login-box">

    <div class="logo">🚌</div>

    <h1>BookMyRoute</h1>

    <p class="subtitle">
        Secure login with Gmail OTP
    </p>

    <!-- GMAIL -->

    <div id="emailSection">

        <label>Gmail Address</label>

        <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            required
        >

        <button id="sendButton" onclick="sendOTP()">
            Send OTP 📩
        </button>

    </div>


    <!-- OTP -->

    <div class="otp-section" id="otpSection">

        <label>Enter OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
        >

        <button onclick="verifyOTP()">
            Verify OTP 🔐
        </button>

        <div class="back" id="backButton"
             onclick="goBack()">
            ← Change Gmail
        </div>

    </div>


    <p class="message" id="message"></p>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

/* ==========================================
   EMAILJS INITIALIZATION
   ========================================== */

emailjs.init({
    publicKey: "hfiFvOzOwwDN2Oaxs"
});


/* ==========================================
   SEND OTP
   ========================================== */

function sendOTP() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");

    const sendButton =
        document.getElementById("sendButton");


    if (!email) {

        message.innerText =
            "❌ Please enter your Gmail address.";

        message.style.color = "red";

        return;
    }


    if (!email.toLowerCase().endsWith("@gmail.com")) {

        message.innerText =
            "❌ Please enter a valid Gmail address.";

        message.style.color = "red";

        return;
    }


    // Generate 6-digit OTP
    const otp =
        Math.floor(100000 + Math.random() * 900000).toString();


    // Store OTP temporarily in browser
    sessionStorage.setItem("bookmyroute_otp", otp);
    sessionStorage.setItem(
        "bookmyroute_otp_time",
        Date.now().toString()
    );

    sessionStorage.setItem(
        "bookmyroute_email",
        email
    );


    sendButton.disabled = true;
    sendButton.innerText = "Sending OTP...";


    const templateParams = {

        to_email: email,

        otp: otp
    };


    emailjs.send(
        "service_g3kqc7k",
        "template_fj17g5p",
        templateParams
    )

    .then(function(response) {

        console.log(
            "EmailJS SUCCESS:",
            response.status,
            response.text
        );

        message.innerText =
            "📩 OTP sent to your Gmail!";

        message.style.color = "green";


        document.getElementById("emailSection")
            .style.display = "none";

        document.getElementById("otpSection")
            .style.display = "block";

        document.getElementById("backButton")
            .style.display = "block";


        sendButton.disabled = false;
        sendButton.innerText = "Send OTP 📩";

    })

    .catch(function(error) {

        console.error(
            "EmailJS ERROR:",
            error
        );

        message.innerText =
            "❌ Could not send OTP. Check EmailJS settings.";

        message.style.color = "red";


        sendButton.disabled = false;
        sendButton.innerText = "Send OTP 📩";

    });
}


/* ==========================================
   VERIFY OTP
   ========================================== */

function verifyOTP() {

    const enteredOTP =
        document.getElementById("otp").value.trim();

    const savedOTP =
        sessionStorage.getItem(
            "bookmyroute_otp"
        );

    const savedTime =
        sessionStorage.getItem(
            "bookmyroute_otp_time"
        );

    const message =
        document.getElementById("message");


    if (enteredOTP.length !== 6) {

        message.innerText =
            "❌ Enter the 6-digit OTP.";

        message.style.color = "red";

        return;
    }


    if (!savedOTP || !savedTime) {

        message.innerText =
            "❌ Please request a new OTP.";

        message.style.color = "red";

        return;
    }


    // 5-minute expiry
    const fiveMinutes =
        5 * 60 * 1000;

    if (
        Date.now() - parseInt(savedTime)
        > fiveMinutes
    ) {

        sessionStorage.removeItem(
            "bookmyroute_otp"
        );

        sessionStorage.removeItem(
            "bookmyroute_otp_time"
        );

        message.innerText =
            "❌ OTP expired. Please request a new one.";

        message.style.color = "red";

        return;
    }


    if (enteredOTP === savedOTP) {

        sessionStorage.removeItem(
            "bookmyroute_otp"
        );

        sessionStorage.removeItem(
            "bookmyroute_otp_time"
        );


        message.innerText =
            "✅ Login successful!";

        message.style.color = "green";


        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 500);

    } else {

        message.innerText =
            "❌ Invalid OTP.";

        message.style.color = "red";
    }
}


/* ==========================================
   GO BACK
   ========================================== */

function goBack() {

    document.getElementById("emailSection")
        .style.display = "block";

    document.getElementById("otpSection")
        .style.display = "none";

    document.getElementById("message")
        .innerText = "";

    document.getElementById("otp")
        .value = "";

    sessionStorage.removeItem(
        "bookmyroute_otp"
    );

    sessionStorage.removeItem(
        "bookmyroute_otp_time"
    );
}

</script>

</body>
</html>
