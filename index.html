<!DOCTYPE html>
<html>
<head>
    <title>BookMyRoute</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071952, #088395);
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            text-align: center;
        }

        .bus {
            font-size: 80px;
            animation: move 1.5s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translateX(-15px);
            }
            to {
                transform: translateX(15px);
            }
        }

        h1 {
            font-size: 35px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #071952;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="bus">🚌</div>

        <h1>Welcome to BookMyRoute</h1>

        <p>Your journey starts here...</p>

        <button onclick="openLogin()">
            Continue to Login →
        </button>

    </div>

    <script>
        function openLogin() {
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
